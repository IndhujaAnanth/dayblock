<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dayblock</title>
<meta name="theme-color" content="#000000" id="themecolor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dayblock">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
/* Layout idea: one calm paper-coloured workspace; each part of the day carries its own hue so the to-do list and the hour grid read as the same thing. */
:root{
  --cal-bg:var(--card); --cal-head:color-mix(in srgb,var(--soft) 55%,var(--card)); --cal-line:var(--line); --cal-out:var(--paper); --cal-hover:var(--soft); --cal-ink:var(--ink); --cal-ink2:var(--ink2);
  /* default: pure black and white */
  --paper:#000000; --card:#0c0c0c; --ink:#ffffff; --ink2:#a8a8a8; --line:#2e2e2e;
  --accent:var(--ink); --accent-ink:var(--paper); --soft:color-mix(in srgb,var(--accent) 16%,var(--paper));
  --star:var(--ink); --danger:var(--ink); --ok:var(--ink);
  --bgL:17%; --lineL:62%; --inkL:88%;
  --s55:0%; --s45:0%; --s42:0%; --s40:0%;
  --exam:#ffffff; --exam-ink:#000000; --fz:1;
  --r:14px; color-scheme:dark;
  --fd:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --fb:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
}
:root[data-bg="charcoal"]{--paper:#161616; --card:#202020; --line:#383838; --ink2:#b4b4b4}
:root[data-bg="white"]{--paper:#ffffff; --card:#f5f5f5; --ink:#000000; --ink2:#555555; --line:#d2d2d2; --bgL:93%; --lineL:44%; --inkL:22%; --exam:#000000; --exam-ink:#ffffff; color-scheme:light}
:root[data-color="on"]{--s55:55%; --s45:45%; --s42:42%; --s40:40%; --exam:#ff5a1f; --exam-ink:#1a1a1a; --star:#f0b44c; --danger:#ff8a78; --ok:#6fd19a}
:root[data-color="on"][data-bg="white"]{--star:#b86f00; --danger:#b3321f; --ok:#2b7a4b}
:root[data-color="on"][data-bg="black"],:root[data-color="on"][data-bg="charcoal"]{--bgL:19%; --inkL:86%}
.mark{filter:grayscale(1)}
:root[data-color="on"] .mark{filter:none}
.task.hasc{box-shadow:inset 4px 0 0 var(--tc)}
.task.hasc .ttl{color:var(--tc)}
.task.hasc .chk span{border-color:var(--tc)}
.task.hasc .chk input:checked+span{background:var(--tc)}
.task.hasc.done .ttl{color:var(--ink2)}
.blk li button[style*="--tc"]{border-color:var(--tc);color:var(--tc)}
.tblk[style*="--tc"]{border-color:var(--tc);border-left-color:var(--tc)}
.chk.part span::after{content:"";width:10px;height:3px;border-radius:2px;background:var(--sline,var(--accent))}
.shead .secall{margin-right:2px}
.blk > header{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.bgrip{opacity:.6}
.tbox{display:flex;align-items:center;gap:8px}
.tbox .field{width:72px;text-align:center}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--c);padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.sw.auto{background:linear-gradient(135deg,#fff 50%,#000 50%)}
.rng{width:100%;accent-color:var(--accent)}
.hdl{display:flex;align-items:center;gap:12px}
@media (max-width:760px){.hdl{width:100%}.hdl .brand{margin-right:auto}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:calc(15px * var(--fz))/1.45 var(--fb);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 80px}
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font:700 calc(21px * var(--fz))/1 var(--fd);letter-spacing:-.02em}
.mark{width:22px;height:22px;border-radius:6px;background:repeating-linear-gradient(180deg,hsl(38 60% 55%) 0 5px,hsl(178 45% 40%) 5px 10px,hsl(262 45% 58%) 10px 15px,hsl(340 55% 58%) 15px 22px)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;margin-left:auto}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:999px;color:var(--ink2);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.status{font-size:calc(12px * var(--fz));color:var(--ink2);width:100%}
.status b{color:var(--danger);font-weight:600}
h1,h2,h3{font-family:var(--fd);letter-spacing:-.02em;text-wrap:balance;margin:0}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0 12px}
.bar h2{font-size:calc(26px * var(--fz));margin-right:auto}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:none}
.btn.icon{padding:7px 11px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--ink2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--accent)}
.note{background:var(--soft);border-radius:12px;padding:10px 14px;margin:12px 0;display:flex;gap:12px;align-items:flex-start}
.note p{margin:0;flex:1}
/* calendar */
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0}
.calw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--cal-line);border-radius:14px;background:var(--cal-bg)}
.calin{min-width:0}
.dow{background:var(--cal-head);border-bottom:1px solid var(--cal-line)}
.dow span{font-size:calc(12px * var(--fz));font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);text-align:center;padding:11px 0;border-left:1px solid var(--cal-line)}
.dow span:first-child{border-left:0}
.cell{display:flex;flex-direction:column;align-items:stretch;text-align:center;min-height:96px;padding:6px 6px;border:0;border-right:1px solid var(--cal-line);border-bottom:1px solid var(--cal-line);background:var(--cal-bg);border-radius:0;overflow:hidden;color:var(--cal-ink);font:inherit}
.cell:nth-child(7n){border-right:0}
.cell:nth-last-child(-n+7){border-bottom:0}
.cell:hover{background:var(--cal-hover)}
.cell.out{background:var(--cal-out);color:var(--cal-ink2)}
.cell.out .ct{opacity:.7}
.cell.exam{background:var(--exam);color:var(--exam-ink)}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.cell.sel{box-shadow:inset 0 0 0 3px var(--accent)}
.cell .dn{align-self:flex-start;font:600 calc(13px * var(--fz)) var(--fd)}
.cell .ct{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:calc(15px * var(--fz));line-height:1.25;word-break:normal;overflow-wrap:break-word;padding:2px 0}
.cell.wkc{min-height:230px}
.cell .ct span{display:block}
.cell .ct .ds{opacity:.55;text-decoration:line-through}
.prog{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.cnt{font-size:calc(11px * var(--fz));color:var(--ink2);font-variant-numeric:tabular-nums}
.sc{display:block;font-size:calc(11px * var(--fz));line-height:1.25;padding:2px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:hsl(var(--h,200) var(--s42) var(--bgL));color:hsl(var(--h,200) var(--s40) var(--inkL))}
.sc.star{--h:38}
.more{font-size:calc(11px * var(--fz));color:var(--ink2)}
@media (max-width:760px){
        .calin{min-width:660px}
  .cell{min-height:110px;padding:6px 6px}
  .cell .ct{font-size:calc(14px * var(--fz));gap:6px}
  .cell.wkc{min-height:200px}
  .dow span{font-size:calc(13px * var(--fz));padding:10px 0}
  .bar h2{font-size:calc(22px * var(--fz))}
}
/* day */
.sec{--sbg:hsl(var(--h) var(--s42) var(--bgL));--sline:hsl(var(--h) var(--s45) var(--lineL));--sink:hsl(var(--h) var(--s40) var(--inkL))}
.secs{display:flex;flex-direction:column;gap:12px}
.scard{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--sline);border-radius:12px;overflow:hidden}
.shead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sbg);color:var(--sink);flex-wrap:wrap}
.shead h3{font-size:calc(17px * var(--fz));margin-right:auto}
.shead .tm{border:1px solid var(--sline);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:calc(13px * var(--fz));font-variant-numeric:tabular-nums}
.shead .ct{font-size:calc(12px * var(--fz));font-variant-numeric:tabular-nums}
.tasks{list-style:none;margin:0;padding:4px 8px}
.task{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.task:last-child{border-bottom:0}
.chk{position:relative;display:inline-flex;width:22px;height:22px;flex:none}
.chk input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chk span{width:22px;height:22px;border-radius:7px;border:2px solid var(--sline,var(--accent));display:grid;place-items:center}
.chk input:checked+span{background:var(--sline,var(--accent))}
.chk input:checked+span::after{content:"";width:6px;height:11px;border:solid var(--card);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.ttl{flex:1;min-width:120px;text-align:left;border:0;background:none;padding:2px 0}
.task.done .ttl{color:var(--ink2);text-decoration:line-through}
.tag{font-size:calc(11px * var(--fz));color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.tag.star{color:var(--star);border-color:var(--star)}
.subs{flex-basis:100%;margin:0 0 4px 30px;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.subs li{display:flex;gap:8px;align-items:center;font-size:calc(14px * var(--fz))}
.subs li.done span.tx{color:var(--ink2);text-decoration:line-through}
.subs .chk,.subs .chk span{width:18px;height:18px}
.addrow{display:flex;gap:8px;padding:8px 12px 10px}
.addin,.field,select.field,textarea.field{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:8px 10px}
.addin{flex:1}
.empty{color:var(--ink2);padding:6px 12px 2px;font-size:calc(13px * var(--fz))}
.quick{display:flex;gap:8px;align-items:center;margin-bottom:12px;color:var(--ink2);font-size:calc(13px * var(--fz));flex-wrap:wrap}
.quick select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 8px}
.dprog{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:calc(13px * var(--fz));color:var(--ink2)}
.dprog .prog{flex:1;height:8px}
/* schedule */
.schedwrap{height:min(72vh,680px);overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);position:relative}
.sched{position:relative;margin:14px 10px 14px 60px;border-left:1px solid var(--line)}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.hr{position:absolute;left:-58px;width:50px;text-align:right;font-size:calc(11px * var(--fz));color:var(--ink2);transform:translateY(-8px);font-variant-numeric:tabular-nums}
.blk{position:absolute;left:6px;border-radius:10px;background:var(--sbg);border-left:4px solid var(--sline);padding:5px 8px;overflow:auto;color:var(--sink)}
.blk header{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.blk h3{font-size:calc(14px * var(--fz))}
.blk .tm{border:0;background:none;color:inherit;text-decoration:underline;font-size:calc(12px * var(--fz));padding:0;font-variant-numeric:tabular-nums}
.blk ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px}
.blk li button{border:1px solid var(--sline);background:var(--card);color:var(--ink);border-radius:999px;padding:1px 9px;font-size:calc(12px * var(--fz))}
.blk li.done button{opacity:.55;text-decoration:line-through}
.tblk{position:absolute;border-radius:8px;background:var(--card);border:1px solid var(--accent);border-left:4px solid var(--accent);padding:3px 7px;font-size:calc(12px * var(--fz));overflow:hidden;text-align:left}
.tblk.done{opacity:.55;text-decoration:line-through}
.lane{position:absolute;top:-12px;font-size:calc(11px * var(--fz));color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.hiddenrow{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--ink2);font-size:calc(13px * var(--fz))}
.rmbtn{border:0;background:none;color:inherit;text-decoration:underline;font-size:calc(12px * var(--fz));padding:0}
.tblk{z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.12);background:var(--card);border-color:var(--sline);border-left:4px solid var(--sline);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile small{display:block;color:var(--ink2);font-size:calc(12px * var(--fz))}
.tile b{font:700 calc(22px * var(--fz)) var(--fd);font-variant-numeric:tabular-nums}
.tile.owe b{color:var(--danger)}.tile.owed b{color:var(--ok)}
.bals{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bal{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:calc(13px * var(--fz))}
.bal.pos{border-color:var(--ok);color:var(--ok)}.bal.neg{border-color:var(--danger);color:var(--danger)}
.mfilters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 6px}
.mfilters .field{width:auto;min-width:130px}
.msum{color:var(--ink2);font-size:calc(13px * var(--fz));margin:8px 0}
.mrow{display:grid;grid-template-columns:78px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow .md{font-size:calc(13px * var(--fz));color:var(--ink2)}
.mrow .mn small{display:block;color:var(--ink2)}
.mrow .ma{font:600 calc(16px * var(--fz)) var(--fd);font-variant-numeric:tabular-nums}
.mrow.owe .ma{color:var(--danger)}.mrow.owed .ma{color:var(--ok)}
.mrow.settled{opacity:.55}.mrow.settled .mn b{text-decoration:line-through}
.mlist{list-style:none;margin:0;padding:0}
@media (max-width:640px){.tiles{grid-template-columns:1fr}.mrow{grid-template-columns:1fr auto}.mrow .md{grid-column:1/-1}}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:10px}
.ncard{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:130px}
.ncard:hover{border-color:var(--accent)}
.ncard h3{font-size:calc(17px * var(--fz))}
.ncard small{margin-top:auto;color:var(--ink2)}
.ntag{font-size:calc(11px * var(--fz));text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:600}
.npv{margin:0;color:var(--ink2);font-size:calc(14px * var(--fz));display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.nl{list-style:none;margin:0;padding:0;font-size:calc(14px * var(--fz));color:var(--ink2)}
.nl li.done{text-decoration:line-through;opacity:.6}
.idea{display:inline-block;margin:0 4px 4px 0;padding:3px 9px;border-radius:8px;font-size:calc(13px * var(--fz));background:hsl(var(--h) var(--s55) var(--bgL));color:hsl(var(--h) var(--s40) var(--inkL))}
.nblock{display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--line);padding-left:10px}
.ntext{resize:none;overflow:hidden;min-height:90px;line-height:1.5}
.dlg.wide{width:min(720px,100%)}
.editor{min-height:260px;max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:12px 14px;line-height:1.55;outline:none}
.editor:focus{border-color:var(--accent)}
.editor:empty::before,.editor>div:only-child:has(>br:only-child)::before{content:attr(data-ph);color:var(--ink2);position:absolute;pointer-events:none}
.editor h3{font-size:calc(19px * var(--fz));margin:6px 0}
.editor hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.editor ul,.editor ol{margin:4px 0;padding-left:24px}
.editor [style*="background-color"]{color:#1b1f23}
.ck{display:flex;gap:8px;align-items:flex-start;margin:3px 0}
.ck .ct{flex:1;min-width:0;outline:none}
.cb{flex:none;width:20px;height:20px;border:2px solid var(--accent);border-radius:6px;margin-top:2px;cursor:pointer;display:inline-block}
.ck[data-done="1"] .cb{background:var(--accent)}
.ck[data-done="1"] .cb::after{content:"";display:block;width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(2px,-1px);margin-left:4px}
.ck[data-done="1"] .ct{text-decoration:line-through;opacity:.6}
.edbar{position:relative;display:flex;align-items:center;gap:10px}
.plus{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font:500 calc(26px * var(--fz))/1 var(--fd)}
.pop{position:absolute;left:0;bottom:48px;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.2);width:min(420px,calc(100vw - 48px));display:flex;flex-direction:column;gap:8px}
.pop[hidden]{display:none}
.ps{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ps>b{width:92px;font-size:calc(12px * var(--fz));color:var(--ink2);font-weight:600}
.pb{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 9px;font-size:calc(13px * var(--fz))}
.pb:hover{border-color:var(--accent)}
.pb.sw{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.ntitle{font:700 calc(22px * var(--fz)) var(--fd)!important}
.nrow{display:flex;gap:8px;align-items:center;padding:4px 0}
.nrow .field{flex:1}
.nrow.ideaP .field{background:hsl(var(--h) var(--s55) var(--bgL));color:hsl(var(--h) var(--s40) var(--inkL))}
@media (max-width:560px){.tabs{max-width:100%;overflow-x:auto}.tabs button{padding:7px 10px;font-size:calc(14px * var(--fz))}}
.grip{border:0;background:none;color:var(--ink2);cursor:grab;touch-action:none;padding:2px 2px;font-size:calc(20px * var(--fz));line-height:1;user-select:none;-webkit-user-select:none;flex:none}
.grip:active{cursor:grabbing}
.tasks .task{transition:transform .12s ease}
.tasks .task.dragging{transition:none;position:relative;z-index:6;background:var(--card);box-shadow:0 6px 20px rgba(0,0,0,.22);border-radius:10px}
body.dragging-task{user-select:none;-webkit-user-select:none;cursor:grabbing}
.dropline{position:absolute;height:4px;border-radius:4px;background:var(--accent);z-index:30;pointer-events:none;box-shadow:0 0 0 2px var(--card)}
.scard.droptarget{outline:3px solid var(--accent);outline-offset:2px}
.starb{border:0;background:none;color:var(--ink2);font-size:calc(19px * var(--fz));line-height:1;padding:0 3px}

<script>
window.__dbApply=function(p){
  var r=document.documentElement,st=r.style;p=p||{};
  r.setAttribute('data-bg',p.bg||'black');r.setAttribute('data-color',p.color?'on':'off');
  st.setProperty('--fz',String((p.size||100)/100));
  var tc=document.getElementById('themecolor');if(tc)tc.setAttribute('content',{black:'#000000',charcoal:'#161616',white:'#ffffff'}[p.bg||'black']||'#000000');
  if(p.accent&&/^#[0-9a-f]{6}$/i.test(p.accent)){
    var h=p.accent,R=parseInt(h.substr(1,2),16),G=parseInt(h.substr(3,2),16),B=parseInt(h.substr(5,2),16);
    st.setProperty('--accent',h);st.setProperty('--accent-ink',(0.299*R+0.587*G+0.114*B)>150?'#000':'#fff');
  }else{st.removeProperty('--accent');st.removeProperty('--accent-ink')}
};
try{window.__dbApply(JSON.parse(localStorage.getItem('dayblock:prefs')||'null'))}catch(e){window.__dbApply(null)}
</script>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var pad=function(n){return String(n).padStart(2,'0')};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)};

/* ---------- constants ---------- */
var SECTIONS=[
  {id:'morning',name:'Morning',h:38,def:'06:00'},
  {id:'before-lunch',name:'Before lunch',h:80,def:'09:00'},
  {id:'after-lunch',name:'After lunch',h:140,def:'13:00'},
  {id:'after-class',name:'After class',h:178,def:'16:00'},
  {id:'before-break',name:'Before break',h:205,def:'17:30'},
  {id:'after-break',name:'After break',h:232,def:'18:00'},
  {id:'before-dinner',name:'Before dinner',h:262,def:'19:30'},
  {id:'after-dinner',name:'After dinner',h:300,def:'20:30'},
  {id:'before-sleep',name:'Before sleep',h:340,def:'22:30'}
];
var SEC={};SECTIONS.forEach(function(s){SEC[s.id]=s});
var DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var DFULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
var MON_FIRST=[1,2,3,4,5,6,0];
var HOUR_H=56;

/* ---------- dates ---------- */
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function dayDiff(a,b){return Math.round((parse(a)-parse(b))/864e5)}
function wd(s){return parse(s).getDay()}
function mondayOf(s){return addDays(s,-((wd(s)+6)%7))}
function todayStr(){return ymd(new Date())}
function fmtShort(s){var d=parse(s);return DN[d.getDay()]+' '+d.getDate()+' '+MN[d.getMonth()].slice(0,3)}
function fmtLong(s){var d=parse(s);return DFULL[d.getDay()]+', '+d.getDate()+' '+MN[d.getMonth()]}
function toMin(t){var p=t.split(':').map(Number);return p[0]*60+p[1]}
function toHM(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function f12(min){if(min>=1440)min=0;var h=Math.floor(min/60),m=min%60;var ap=h<12?'AM':'PM';var hh=h%12===0?12:h%12;return m?hh+':'+pad(m)+' '+ap:hh+' '+ap}
function hue(str){var h=0;for(var i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))%360;return h}

/* ---------- storage ---------- */
function withTimeout(p,ms){
  return new Promise(function(res){
    var t=setTimeout(function(){res(null)},ms);
    Promise.resolve(p).then(function(v){clearTimeout(t);res(v)},function(){clearTimeout(t);res(null)});
  });
}
var Store={
  mode:'boot',col:null,pending:{},timers:{},busy:{},dirty:{},onStatus:null,readyP:null,
  init:function(){
    var self=this;
    this.readyP=Promise.resolve().then(function(){
      if(!(window.claude&&window.claude.use))return;
      return withTimeout(Promise.all([window.claude.use('db'),window.claude.use('user')]),6000).then(function(r){
        if(!r||!r[0]||!r[1])return;
        return withTimeout(Promise.resolve(r[1].id()),4000).then(function(id){
          if(id){self.col=r[0].collection('data/users/'+id);self.mode='cloud'}
        });
      });
    }).catch(function(){}).then(function(){if(self.mode!=='cloud')self.mode='local';self.status()});
    return this.readyP;
  },
  status:function(s){if(this.onStatus)this.onStatus(s||'')},
  readLocal:function(name){try{var v=localStorage.getItem('dayblock:'+name);return v?JSON.parse(v):null}catch(e){return null}},
  read:function(name){
    var self=this;
    return (this.readyP||Promise.resolve()).then(function(){
      if(self.mode==='cloud'){
        return self.col.doc(name).get().then(function(sn){return sn.exists?sn.data():null}).catch(function(){self.mode='local';self.status();return self.readLocal(name)});
      }
      return self.readLocal(name);
    });
  },
  clearPending:function(){var self=this;Object.keys(this.timers).forEach(function(k){clearTimeout(self.timers[k])});this.pending={};this.dirty={}},
  write:function(name,obj){
    var self=this;
    this.pending[name]=obj;
    try{localStorage.setItem('dayblock:'+name,JSON.stringify(obj))}catch(e){}
    this.status('saving');
    clearTimeout(this.timers[name]);
    this.timers[name]=setTimeout(function(){self.flush(name)},400);
  },
  flush:function(name){
    var self=this;
    if(this.mode!=='cloud'){this.status();return}
    if(this.busy[name]){this.dirty[name]=true;return}
    var obj=this.pending[name];if(!obj)return;
    this.busy[name]=true;
    this.col.doc(name).set(JSON.parse(JSON.stringify(obj))).then(function(){
      self.busy[name]=false;
      if(self.dirty[name]){self.dirty[name]=false;self.flush(name)}else self.status('saved');
    }).catch(function(){self.busy[name]=false;self.status('error')});
  }
};

/* ---------- state ---------- */
var state={meta:null,tasks:[],study:[],money:[],notes:[],snaps:[],done:{}};
var monthLoads={};
var ui={view:'month',date:todayStr(),dayMode:'todo',studyMode:'month',studyDate:todayStr(),expanded:{},quickRep:'once',mf:{kind:'all',status:'all',person:'',month:'',q:''},nf:{kind:'all',q:''},focus:null,modal:null,schedScroll:null,ready:false};

function defaultMeta(){return {weekTimes:{},dateTimes:{},vis:{all:{},week:{},date:{}},seeded:false,noteDismissed:false}}
function touch(){if(!ui.silent)ui.touched=true}
function saveTasks(){touch();Store.write('tasks',{list:state.tasks})}
function saveStudy(){touch();Store.write('study',{list:state.study})}
function saveNotes(){touch();Store.write('notes',{list:state.notes})}
function saveMoney(){touch();Store.write('money',{list:state.money})}
function saveMeta(){touch();Store.write('meta',state.meta)}
function saveDone(ym){touch();Store.write('done-'+ym,{keys:state.done[ym]||{}})}

function ensureMonth(ym){
  if(ym in state.done)return Promise.resolve();
  if(monthLoads[ym])return monthLoads[ym];
  monthLoads[ym]=Store.read('done-'+ym).then(function(d){state.done[ym]=(d&&d.keys)||{}}).catch(function(){state.done[ym]={}});
  return monthLoads[ym];
}
function need(dates){
  var yms=[];dates.forEach(function(d){var ym=d.slice(0,7);if(!(ym in state.done)&&yms.indexOf(ym)<0)yms.push(ym)});
  if(yms.length)Promise.all(yms.map(ensureMonth)).then(function(){render()});
}
function doneKey(date,id,sub){return date+'|'+id+(sub?'|'+sub:'')}
function setDoneMany(date,items,val){
  var ym=date.slice(0,7);
  return ensureMonth(ym).then(function(){
    var m=state.done[ym];
    items.forEach(function(t){
      var ks=[doneKey(date,t.id)].concat((t.subs||[]).map(function(sb){return doneKey(date,t.id,sb.id)}));
      ks.forEach(function(k){if(val)m[k]=1;else delete m[k]});
    });
    saveDone(ym);render();
  });
}
function isDone(date,id,sub){var m=state.done[date.slice(0,7)];return !!(m&&m[doneKey(date,id,sub)])}
function setDone(date,id,sub,val){
  var ym=date.slice(0,7);
  return ensureMonth(ym).then(function(){
    var m=state.done[ym];var k=doneKey(date,id,sub);
    if(val)m[k]=1;else delete m[k];
    saveDone(ym);render();
  });
}

/* ---------- recurrence ---------- */
function occurs(t,date){
  if(date<t.start)return false;
  if(t.until&&date>t.until)return false;
  if(t.skip&&t.skip.indexOf(date)>=0)return false;
  var r=t.rule;
  if(r.kind==='once')return date===t.start;
  var n=Math.max(1,r.every||1);
  if(r.unit==='day')return dayDiff(date,t.start)%n===0;
  var days=(r.days&&r.days.length)?r.days:[wd(t.start)];
  if(days.indexOf(wd(date))<0)return false;
  var weeks=Math.round(dayDiff(mondayOf(date),mondayOf(t.start))/7);
  return weeks>=0&&weeks%n===0;
}
function secVisible(date,id){
  var v=state.meta.vis;if(!v)return true;
  var d=v.date[date];if(d&&id in d)return d[id];
  var w=v.week[wd(date)];if(w&&id in w)return w[id];
  if(id in v.all)return v.all[id];
  return true;
}
function visibleSections(date){return SECTIONS.filter(function(s){return secVisible(date,s.id)})}
function tasksOn(date){return state.tasks.filter(function(t){return occurs(t,date)&&secVisible(date,t.section)})}
function describeRule(t){
  var r=t.rule;
  if(r.kind==='once')return 'Only '+fmtShort(t.start);
  var s;
  if(r.unit==='day')s=r.every===1?'Every day':'Every '+r.every+' days';
  else{
    var ds=(r.days&&r.days.length?r.days:[wd(t.start)]).slice().sort(function(a,b){return MON_FIRST.indexOf(a)-MON_FIRST.indexOf(b)}).map(function(i){return DN[i]});
    s=(r.every===1?'Weekly: ':'Every '+r.every+' weeks: ')+ds.join(', ');
  }
  if(t.until)s+=' until '+fmtShort(t.until);
  return s;
}
function shortRule(t){
  var r=t.rule;
  if(r.kind==='once')return '';
  if(r.unit==='day'&&r.every===1)return 'daily';
  if(r.unit==='week'&&r.every===1){var ds=(r.days&&r.days.length?r.days:[wd(t.start)]);if(ds.length===7)return 'daily';return ds.slice().sort(function(a,b){return MON_FIRST.indexOf(a)-MON_FIRST.indexOf(b)}).map(function(i){return DN[i]}).join(' ')}
  return 'repeats';
}

/* ---------- section times ---------- */
function sectionTimes(date){
  var base=state.meta.weekTimes[wd(date)]||{},over=state.meta.dateTimes[date]||{},out={};
  SECTIONS.forEach(function(s){out[s.id]=over[s.id]||base[s.id]||s.def});
  return out;
}
function sectionRanges(date){
  var t=sectionTimes(date);
  var arr=SECTIONS.map(function(s,i){return {id:s.id,i:i,start:toMin(t[s.id])}}).filter(function(a){return secVisible(date,a.id)}).sort(function(a,b){return a.start-b.start||a.i-b.i});
  var out={};
  arr.forEach(function(a,k){out[a.id]={start:a.start,end:arr[k+1]?arr[k+1].start:1440,order:k}});
  return out;
}

/* ---------- seed ---------- */
function seedTasks(){
  var start=todayStr(),list=[];
  function add(title,section,rule,star){list.push({id:uid(),title:title,section:section,star:!!star,start:start,until:null,rule:rule,skip:[],subs:[],time:null})}
  var daily={kind:'rep',unit:'day',every:1};
  ['charge phone','brush','poo','oil massage face','multani metti','meditate','pray','bath','keep the required books','take tablets','take water bottle','wear heels'].forEach(function(t){add(t,'morning',daily)});
  ["study for tomorrow's class",'assignment','do project related work','python dsa'].forEach(function(t){add(t,'after-class',daily)});
  add('complete record','after-class',{kind:'rep',unit:'week',every:1,days:[1,3]},true);
  ['eat less','talk to pati','talk to appa','eat nuts','bath','take lice'].forEach(function(t){add(t,'after-dinner',daily)});
  ['meditate','tablets','aloe vera','plate'].forEach(function(t){add(t,'before-sleep',daily)});
  return list;
}

/* ---------- timetable ---------- */
var TT={
  1:[['Digital-H42','10:00','10:50'],['EDC-H43','11:00','11:50'],['Digital-L214','14:00','16:50']],
  2:[['AI-H15','09:00','09:50'],['LA','10:00','10:50'],['Signals-H43','11:00','11:50'],['LA (1-24)','14:00','16:50']],
  3:[['AI-L507, 509','09:00','10:50'],['Digital-H42','11:00','11:50'],['EDC-H43','12:00','12:50'],['EDC Practice L217','14:00','16:50']],
  4:[['EDC-H43','09:00','09:50'],['AI-H15','10:00','10:50'],['LA','11:00','11:50'],['Signals-H43','12:00','13:45']],
  5:[['Signals-H43','09:00','09:50'],['EDC-H43','10:00','10:50'],['Digital-H42','11:00','12:50']]
};
function applyTimetable(){
  var start=todayStr(),m=state.meta;
  [1,2,3,4,5].forEach(function(w){
    var t=m.weekTimes[w]=m.weekTimes[w]||{};
    t['before-lunch']='08:00';t['after-lunch']='13:00';t['after-class']=w<=3?'16:50':'13:50';
    TT[w].forEach(function(c){
      state.tasks.push({id:uid(),title:c[0],section:toMin(c[1])<780?'before-lunch':'after-lunch',star:false,start:start,until:null,rule:{kind:'rep',unit:'week',every:1,days:[w]},skip:[],subs:[],time:{s:c[1],e:c[2]},tt:1});
    });
  });
  state.tasks.push({id:uid(),title:'Lunch',section:'after-lunch',star:false,start:start,until:null,rule:{kind:'rep',unit:'week',every:1,days:[1,2,3,4,5]},skip:[],subs:[],time:{s:'13:00',e:'13:50'},tt:1});
  [6,0].forEach(function(w){m.vis.week[w]=m.vis.week[w]||{};m.vis.week[w]['after-class']=false});
}

/* ---------- toast ---------- */
var toastT;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2200)}

/* ---------- render: chrome ---------- */
var TABS=[['month','Month'],['week','Week'],['day','Day'],['study','Study'],['money','Money'],['notes','Notes']];
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(function(t){return '<button type="button" role="tab" aria-selected="'+(ui.view===t[0])+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+'</button>'}).join('');
}
var BK=' <button type="button" class="rmbtn" data-act="backup">Backup or restore</button>';
function renderStatus(s){
  var el=$('#status');
  if(Store.mode==='local')el.innerHTML='<b>Saved on this device.</b> Use Backup or restore now and then to keep a copy. Last copied backup: '+ago(state.meta&&state.meta.lastBackup)+'.';
  else if(s==='saving')el.textContent='Saving…';
  else if(s==='error')el.innerHTML='<b>Could not save to your account.</b> Your changes are kept on this device. Try again in a moment.';
  else if(s==='saved')el.textContent='All changes saved to your account.';
  else el.textContent='';
  el.insertAdjacentHTML('beforeend',BK);
}

function barHTML(title,prev,next,extra){
  return '<div class="bar"><h2>'+esc(title)+'</h2>'
    +'<button class="btn icon" type="button" aria-label="Previous" data-act="'+prev+'">‹</button>'
    +'<button class="btn" type="button" data-act="today">Today</button>'
    +'<button class="btn icon" type="button" aria-label="Next" data-act="'+next+'">›</button>'+(extra||'')+'</div>';
}

/* ---------- month / week ---------- */
function monthView(mode){
  var f=parse(ui.date),y=f.getFullYear(),m=f.getMonth();
  var first=ymd(new Date(y,m,1));
  var gridStart=addDays(first,-((parse(first).getDay()+6)%7));
  var dates=[];for(var i=0;i<42;i++)dates.push(addDays(gridStart,i));
  if(mode!=='study')need(dates);
  var today=todayStr();
  var cells=dates.map(function(d){
    var inM=parse(d).getMonth()===m,names=[],exam=false;
    if(mode==='study'){
      state.study.filter(function(e){return e.date===d}).forEach(function(e){names.push({t:(e.subject||'')+(e.chapter?' · '+e.chapter:''),done:e.done})});
    }else{
      tasksOn(d).filter(function(t){return t.star}).forEach(function(t){names.push({t:t.title,done:isDone(d,t.id),c:t.color});if(/exam/i.test(t.title))exam=true});
    }
    var body=names.length?'<div class="ct">'+names.map(function(n){return '<span'+(n.done?' class="ds"':'')+(n.c&&!exam?' style="color:'+n.c+'"':'')+'>'+esc(n.t)+'</span>'}).join('')+'</div>':'<div class="ct"></div>';
    return '<button type="button" class="cell'+(inM?'':' out')+(exam?' exam':'')+(d===today?' today':'')+(d===(mode==='study'?ui.studyDate:ui.date)&&mode==='study'?' sel':'')+'" data-act="'+(mode==='study'?'study-pick':'open-day')+'" data-date="'+d+'" aria-label="'+esc(fmtLong(d))+'"><span class="dn">'+parse(d).getDate()+'</span>'+body+'</button>';
  }).join('');
  var head=barHTML(MN[m]+' '+y,'nav-m-1','nav-m1',mode==='study'?studySeg():'');
  return head+'<div class="calw"><div class="calin"><div class="dow">'+MON_FIRST.map(function(i){return '<span>'+DN[i]+'</span>'}).join('')+'</div><div class="grid">'+cells+'</div></div></div>';
}
function weekView(mode){
  var ws=mondayOf(ui.date),today=todayStr(),dates=[];
  for(var i=0;i<7;i++)dates.push(addDays(ws,i));
  if(mode!=='study')need(dates);
  var a=parse(dates[0]),b=parse(dates[6]);
  var label=a.getDate()+' '+MN[a.getMonth()].slice(0,3)+' – '+b.getDate()+' '+MN[b.getMonth()].slice(0,3)+' '+b.getFullYear();
  var cells=dates.map(function(d){
    var names=[],exam=false;
    if(mode==='study'){
      state.study.filter(function(e){return e.date===d}).forEach(function(e){names.push({t:(e.subject||'')+(e.chapter?' \u00b7 '+e.chapter:''),done:e.done})});
    }else{
      tasksOn(d).filter(function(t){return t.star}).forEach(function(t){names.push({t:t.title,done:isDone(d,t.id),c:t.color});if(/exam/i.test(t.title))exam=true});
    }
    var body='<div class="ct">'+names.map(function(n){return '<span'+(n.done?' class="ds"':'')+(n.c&&!exam?' style="color:'+n.c+'"':'')+'>'+esc(n.t)+'</span>'}).join('')+'</div>';
    return '<button type="button" class="cell wkc'+(exam?' exam':'')+(d===today?' today':'')+'" data-act="'+(mode==='study'?'study-pick':'open-day')+'" data-date="'+d+'" aria-label="'+esc(fmtLong(d))+'"><span class="dn">'+parse(d).getDate()+'</span>'+body+'</button>';
  }).join('');

function todoBody(date){
  var ranges=sectionRanges(date),ts=tasksOn(date);
  var order=visibleSections(date).sort(function(a,b){return ranges[a.id].order-ranges[b.id].order});
  var quick='<div class="quick">New tasks repeat: <select id="qrep" data-chg="qrep" aria-label="New task repeat"><option value="once"'+(ui.quickRep==='once'?' selected':'')+'>Only this day</option><option value="daily"'+(ui.quickRep==='daily'?' selected':'')+'>Every day</option><option value="weekly"'+(ui.quickRep==='weekly'?' selected':'')+'>Every '+DFULL[wd(date)]+'</option></select></div>';
  var cards=order.map(function(s){
    var r=ranges[s.id],items=ts.filter(function(t){return t.section===s.id});
    var dn=items.filter(function(t){return isDone(date,t.id)}).length;
    var rows=items.map(function(t){return taskRow(t,date)}).join('');
    var allOn=items.length>0&&dn===items.length,partOn=dn>0&&dn<items.length;
    return '<section class="scard sec" data-section="'+s.id+'" style="--h:'+s.h+'"><div class="shead"><label class="chk secall'+(partOn?' part':'')+'" title="Tick everything in '+s.name.toLowerCase()+'"><input type="checkbox" data-chg="sec-all" data-sec="'+s.id+'"'+(allOn?' checked':'')+(items.length?'':' disabled')+' aria-label="Tick all of '+s.name+'"><span></span></label><h3>'+s.name+'</h3><button type="button" class="tm" data-act="edit-time" data-sec="'+s.id+'" aria-label="Change start time of '+s.name+'">'+f12(r.start)+' – '+f12(r.end)+'</button><span class="ct">'+dn+'/'+items.length+'</span><button type="button" class="rmbtn" data-act="sec-hide" data-sec="'+s.id+'" aria-label="Remove '+s.name+' from this day">Remove</button></div>'
      +(items.length?'<ul class="tasks">'+rows+'</ul>':'<div class="empty">Nothing here yet.</div>')
      +'<form class="addrow" data-addform="'+s.id+'" autocomplete="off"><input class="addin" id="add-'+s.id+'" data-sec="'+s.id+'" enterkeyhint="done" placeholder="Add to '+s.name.toLowerCase()+'" aria-label="Add task to '+s.name+'"><button type="submit" class="btn primary">Add</button><button type="button" class="btn" data-act="new-task" data-sec="'+s.id+'">More</button></form></section>';
  }).join('');
  var hid=SECTIONS.filter(function(s){return !secVisible(date,s.id)});
  var hidRow=hid.length?'<div class="hiddenrow">Hidden parts of the day: '+hid.map(function(s){return '<button type="button" class="chipb" data-act="sec-show" data-sec="'+s.id+'">Show '+s.name+'</button>'}).join('')+'</div>':'';
  return quick+'<div class="secs">'+cards+'</div>'+hidRow;
}
function taskRow(t,date){
  var done=isDone(date,t.id),sd=0;
  t.subs.forEach(function(s){if(isDone(date,t.id,s.id))sd++});
  var open=!!ui.expanded[t.id];
  var tags=(shortRule(t)?'<span class="tag">'+esc(shortRule(t))+'</span>':'')+(t.time?'<span class="tag">'+f12(toMin(t.time.s))+'–'+f12(toMin(t.time.e))+'</span>':'');
  var subsBtn='<button type="button" class="tag" data-act="subs" data-id="'+t.id+'" aria-expanded="'+open+'">'+(open?'▾':'▸')+' '+(t.subs.length?sd+'/'+t.subs.length+' subtasks':'subtasks')+'</button>';
  var subs='';
  if(open){
    subs='<ul class="subs">'+t.subs.map(function(s){var d=isDone(date,t.id,s.id);return '<li class="'+(d?'done':'')+'"><label class="chk"><input type="checkbox" data-chg="toggle-sub" data-id="'+t.id+'" data-sub="'+s.id+'"'+(d?' checked':'')+' aria-label="'+esc(s.title)+'"><span></span></label><span class="tx">'+esc(s.title)+'</span></li>'}).join('')
      +'<li><input class="addin" id="sub-'+t.id+'" data-subadd="'+t.id+'" placeholder="Add a subtask and press Enter" aria-label="Add subtask"></li></ul>';
  }
  return '<li class="task'+(done?' done':'')+(t.color?' hasc':'')+'" data-id="'+t.id+'"'+taskColorStyle(t)+'><button type="button" class="grip" id="grip-'+t.id+'" aria-label="Move '+esc(t.title)+'. Drag, or use the up and down arrow keys." title="Drag to reorder">\u283f</button><label class="chk"><input type="checkbox" data-chg="toggle" data-id="'+t.id+'"'+(done?' checked':'')+' aria-label="Done: '+esc(t.title)+'"><span></span></label><button type="button" class="ttl" data-act="edit-task" data-id="'+t.id+'">'+esc(t.title)+'</button><button type="button" class="starb" data-act="star" data-id="'+t.id+'" aria-pressed="'+(t.star?'true':'false')+'" aria-label="'+(t.star?'Remove from important':'Mark important')+'" title="Mark important">'+(t.star?'\u2605':'\u2606')+'</button>'+tags+subsBtn+subs+'</li>';
}
function scheduleBody(date){
  var ranges=sectionRanges(date),ts=tasksOn(date),today=todayStr();
  var vis=visibleSections(date);
  var timed=ts.filter(function(t){return t.time});
  var lines='';
  for(var h=0;h<=24;h++)lines+='<div class="hl" style="top:'+(h*HOUR_H)+'px"></div><div class="hr" style="top:'+(h*HOUR_H)+'px">'+(h===24?'12 AM':f12(h*60))+'</div>';
  var blocks=vis.map(function(s){
    var r=ranges[s.id];
    var items=ts.filter(function(t){return t.section===s.id&&!t.time});
    var hasTimed=timed.some(function(t){return t.section===s.id});
    var bh=Math.max((r.end-r.start)/60*HOUR_H-3,34);
    var chips=items.map(function(t){var d=isDone(date,t.id);return '<li class="'+(d?'done':'')+'"><button type="button" data-act="toggle-btn" data-id="'+t.id+'" aria-pressed="'+d+'"'+taskColorStyle(t)+'>'+esc(t.title)+'</button></li>'}).join('');
    return '<div class="blk sec" data-sec="'+s.id+'" style="--h:'+s.h+';top:'+(r.start/60*HOUR_H+1)+'px;height:'+bh+'px;right:6px"><header'+(hasTimed?' style="max-width:57%"':'')+' title="Drag up or down to change the time"><h3><span class="bgrip" aria-hidden="true">\u283f</span> '+s.name+'</h3><span><button type="button" class="tm" data-act="edit-time" data-sec="'+s.id+'">'+f12(r.start)+' – '+f12(r.end)+'</button> <button type="button" class="tm" data-act="sec-hide" data-sec="'+s.id+'">Remove</button></span></header>'+(chips?'<ul'+(hasTimed?' style="max-width:56%"':'')+'>'+chips+'</ul>':'')+'</div>';
  }).join('');
  var tb='';
  if(timed.length){
    var sorted=timed.slice().sort(function(a,b){return toMin(a.time.s)-toMin(b.time.s)});
    var cols=[];
    sorted.forEach(function(t){
      var s0=toMin(t.time.s),e0=Math.max(toMin(t.time.e),s0+30),c=0;
      while(cols[c]!==undefined&&cols[c]>s0)c++;
      cols[c]=e0;t._c=c;t._e=e0;
    });
    var nc=Math.max.apply(null,sorted.map(function(t){return t._c}))+1;
    tb=sorted.map(function(t){
      var s0=toMin(t.time.s),w=38/nc;
      return '<button type="button" class="tblk sec'+(isDone(date,t.id)?' done':'')+'" data-act="toggle-btn" data-id="'+t.id+'" style="'+(t.color?'--tc:'+t.color+';':'')+'--h:'+SEC[t.section].h+';top:'+(s0/60*HOUR_H+1)+'px;height:'+Math.max((t._e-s0)/60*HOUR_H-3,26)+'px;left:'+(60+t._c*w)+'%;width:calc('+w+'% - 6px)"><b>'+esc(t.title)+'</b><br><small>'+f12(s0)+' – '+f12(t._e)+'</small></button>';
    }).join('');
  }
  var now='';
  if(date===today){var n=new Date();now='<div class="nowline" style="top:'+((n.getHours()*60+n.getMinutes())/60*HOUR_H)+'px"></div>'}
  var hid=SECTIONS.filter(function(s){return !secVisible(date,s.id)});
  var hidRow=hid.length?'<div class="hiddenrow">Hidden parts of the day: '+hid.map(function(s){return '<button type="button" class="chipb" data-act="sec-show" data-sec="'+s.id+'">Show '+s.name+'</button>'}).join('')+'</div>':'';
  return '<div class="schedwrap" id="schedwrap"><div class="sched" style="height:'+(24*HOUR_H)+'px">'+lines+blocks+tb+now+'</div></div>'
    +'<p class="more" style="margin-top:8px">Tap a task to tick it. Drag a section up or down to move it, or tap its time to type one. A task with its own time sits inside its section at that time.</p>'+hidRow;
}

/* ---------- move between sections ---------- */
function getTask(id){return state.tasks.filter(function(x){return x.id===id})[0]}
function moveScopeModal(m){
  var t=getTask(m.id);
  return '<h2>Move \u201c'+esc(t?t.title:'task')+'\u201d to '+esc(SEC[m.sec].name.toLowerCase())+'</h2><p style="margin:0">This task repeats. Which days should it move?</p>'
    +'<div class="foot" style="justify-content:flex-start;flex-direction:column;align-items:stretch">'
    +'<button type="button" class="btn" data-act="move-do" data-v="day">Only '+esc(fmtShort(m.date))+'</button>'
    +'<button type="button" class="btn" data-act="move-do" data-v="all">Every time it repeats</button>'
    +'<button type="button" class="btn ghost" data-act="close">Cancel</button></div>';

function doMove(id,date,sec,idx,scope){
  var t=getTask(id);if(!t)return;
  var newId=id;
  if(scope==='day'){
    t.skip=(t.skip||[]).concat([date]);
    newId=uid();
    var idMap={};
    var subs=t.subs.map(function(x){var ns=uid();idMap[x.id]=ns;return {id:ns,title:x.title}});
    state.tasks.push({id:newId,title:t.title,section:sec,star:t.star,start:date,until:null,rule:{kind:'once'},skip:[],subs:subs,time:t.time});
    var ym=date.slice(0,7),dm=state.done[ym]||{};
    Object.keys(dm).forEach(function(k){
      var p=k.split('|');
      if(p[0]===date&&p[1]===id){delete dm[k];dm[date+'|'+newId+(p[2]?'|'+(idMap[p[2]]||p[2]):'')]=1}
    });
    saveDone(ym);
  }else t.section=sec;
  var ids=tasksOn(date).filter(function(x){return x.section===sec&&x.id!==newId}).map(function(x){return x.id});
  ids.splice(Math.min(idx,ids.length),0,newId);
  applyOrder(ids);
  closeModal();render();toast('Moved to '+SEC[sec].name.toLowerCase());
}

/* ---------- automatic backups ---------- */
function maybeSnapshot(force){
  var today=todayStr(),last=state.snaps[0];
  if(!force&&last&&last.d===today)return;
  if(!state.tasks.length&&!state.notes.length&&!state.money.length&&!state.study.length)return;
  state.snaps.unshift({t:Date.now(),d:today,json:backupData()});
  while(state.snaps.length>14)state.snaps.pop();
  while(state.snaps.length>1&&JSON.stringify({list:state.snaps}).length>230000)state.snaps.pop();
  Store.write('snaps',{list:state.snaps});
}
function loadSnaps(){
  return Store.read('snaps').then(function(d){state.snaps=(d&&d.list)?d.list:[];maybeSnapshot(false)});
}
function ago(ts){
  if(!ts)return 'never';
  var d=Math.floor((Date.now()-ts)/864e5);
  return d<=0?'today':d===1?'yesterday':d+' days ago';
}

/* ---------- backup ---------- */
function backupData(){
  var done={};
  Object.keys(state.done).forEach(function(k){if(Object.keys(state.done[k]||{}).length)done[k]=state.done[k]});
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('dayblock:done-')===0){var ym=k.slice(14);if(!done[ym]){var v=JSON.parse(localStorage.getItem(k));if(v&&v.keys&&Object.keys(v.keys).length)done[ym]=v.keys}}}}catch(e){}
  return JSON.stringify({app:'dayblock',v:1,saved:new Date().toISOString(),meta:state.meta,tasks:state.tasks,study:state.study,money:state.money,notes:state.notes,done:done});
}
function backupModal(m){
  return '<h2>Backup and restore</h2>'
    +'<p style="margin:0">Copy this text and keep it somewhere safe, for example send it to yourself. If your data ever disappears, paste it back below and tap Restore.</p>'
    +'<label class="fl">Your backup<textarea class="field" id="bk-out" rows="5" readonly>'+esc(backupData())+'</textarea></label>'
    +'<div><button type="button" class="btn primary" data-act="bk-copy">Copy backup</button></div>'
    +'<label class="fl">Restore from a backup<textarea class="field" id="bk-in" data-bkin="1" rows="4" placeholder="Paste a backup here">'+esc(m.pasted||'')+'</textarea></label>'
    +'<div class="fl">Automatic backups<span>One is saved each day you open the page, and the last 14 are kept. They live with your other data, so they protect you from mistakes, not from clearing the browser.</span>'
    +(state.snaps.length?'<ul class="rlist">'+state.snaps.map(function(sn,i){var dt=new Date(sn.t);return '<li><span class="ttl">'+esc(fmtShort(sn.d))+' at '+f12(dt.getHours()*60+dt.getMinutes())+'</span><button type="button" class="btn'+(m.snapConfirm===i?' danger':'')+'" data-act="snap-restore" data-i="'+i+'">'+(m.snapConfirm===i?'Tap again to restore':'Restore')+'</button></li>'}).join('')+'</ul>':'<span>None yet.</span>')+'</div>'
    +'<div class="foot"><button type="button" class="btn left'+(m.confirm?' danger':'')+'" data-act="bk-restore">'+(m.confirm?'Tap again to replace everything':'Restore from this text')+'</button><button type="button" class="btn primary" data-act="close">Done</button></div>';
}
function restoreBackup(txt){
  var d=JSON.parse(txt);
  if(!d||d.app!=='dayblock'||!Array.isArray(d.tasks))throw new Error('bad');
  setStateFrom(d.meta,{list:d.tasks},{list:d.study||[]},{list:d.money||[]},{list:d.notes||[]});
  state.done={};monthLoads={};
  Object.keys(d.done||{}).forEach(function(ym){state.done[ym]=d.done[ym];monthLoads[ym]=Promise.resolve()});
  saveMeta();saveTasks();saveStudy();saveMoney();saveNotes();
  Object.keys(state.done).forEach(function(ym){saveDone(ym)});
}

/* ---------- money ---------- */
function money(n){return '\u20b9'+new Intl.NumberFormat('en-IN',{maximumFractionDigits:2}).format(n)}
function pkey(n){return String(n||'').trim().toLowerCase()}
function moneyPeople(){
  var seen={},out=[];
  state.money.forEach(function(e){var k=pkey(e.person);if(k&&!seen[k]){seen[k]=1;out.push(e.person.trim())}});
  return out.sort(function(a,b){return a.localeCompare(b)});
}
function moneyLabel(e){return e.kind==='spent'?'Spent':e.kind==='owe'?'You owe '+e.person:e.person+' owes you'}
function filteredMoney(){
  var f=ui.mf,q=f.q.trim().toLowerCase();
  return state.money.filter(function(e){
    if(f.kind!=='all'&&e.kind!==f.kind)return false;
    if(f.person&&pkey(e.person)!==pkey(f.person))return false;
    if(f.month&&e.date.slice(0,7)!==f.month)return false;
    if(f.status==='open'&&(e.kind==='spent'||e.settled))return false;
    if(f.status==='settled'&&(e.kind==='spent'||!e.settled))return false;
    if(q&&(e.note+' '+e.person).toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
}
function moneyListHTML(){
  var rows=filteredMoney(),sp=0,ow=0,od=0;
  rows.forEach(function(e){if(e.kind==='spent')sp+=e.amount;else if(!e.settled){if(e.kind==='owe')ow+=e.amount;else od+=e.amount}});
  var sum='<p class="msum">'+rows.length+' entr'+(rows.length===1?'y':'ies')+' shown · Spent '+money(sp)+' · You owe '+money(ow)+' · Owed to you '+money(od)+'</p>';
  if(!rows.length)return sum+'<p class="more">Nothing matches. Add an entry or change the filters.</p>';
  return sum+'<ul class="mlist">'+rows.map(function(e){
    var debt=e.kind!=='spent';
    return '<li class="mrow '+e.kind+(e.settled?' settled':'')+'"><span class="md">'+esc(fmtShort(e.date))+'</span><span class="mn"><b>'+esc(e.note||'No note')+'</b><small>'+esc(moneyLabel(e))+(e.settled?' · settled':'')+'</small></span><span class="ma">'+money(e.amount)+'</span><span class="row" style="gap:6px;flex-wrap:nowrap">'
      +(debt?'<label class="row" style="gap:5px;font-size:13px;color:var(--ink2)"><span class="chk"><input type="checkbox" data-chg="m-settle" data-id="'+e.id+'"'+(e.settled?' checked':'')+' aria-label="Settled"><span></span></span>Settled</label>':'')
      +'<button type="button" class="btn ghost" data-act="m-edit" data-id="'+e.id+'">Edit</button></span></li>';
  }).join('')+'</ul>';
}
function moneyView(){
  var mo=todayStr().slice(0,7),spentM=0,owe=0,owed=0,per={},names={};

    if(e.kind==='spent'){if(e.date.slice(0,7)===mo)spentM+=e.amount;return}

  var bals=Object.keys(per).filter(function(k){return Math.abs(per[k])>0.004}).sort(function(a,b){return Math.abs(per[b])-Math.abs(per[a])}).map(function(k){
    var v=per[k];return v>0?'<span class="bal pos">'+esc(names[k])+' owes you '+money(v)+'</span>':'<span class="bal neg">You owe '+esc(names[k])+' '+money(-v)+'</span>';

  var filters='<div class="mfilters" role="group" aria-label="Filters">'+chips('kind',[['all','All'],['spent','Spent'],['owe','I owe'],['owed','Owed to me']])+'</div>'

    +'<select class="field" data-chg="mf-sel" data-key="person" aria-label="Person"><option value="">Everyone</option>'+moneyPeople().map(function(n){return '<option value="'+esc(n)+'"'+(pkey(f.person)===pkey(n)?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select>'
    +'<select class="field" data-chg="mf-sel" data-key="month" aria-label="Month"><option value="">All time</option>'+months.map(function(m){var p=m.split('-');return '<option value="'+m+'"'+(f.month===m?' selected':'')+'>'+MN[+p[1]-1]+' '+p[0]+'</option>'}).join('')+'</select>'
    +'<input class="field" data-mq="1" placeholder="Search note or name" value="'+esc(f.q)+'" aria-label="Search"></div>';
  return '<div class="bar"><h2>Money</h2><button type="button" class="btn primary" data-act="money-add">Add entry</button></div>'+tiles+(bals?'<div class="bals" aria-label="Balance per person">'+bals+'</div>':'')+filters+'<div id="mlist">'+moneyListHTML()+'</div>';
}
function moneyModal(m){
  var d=m.draft,debt=d.kind!=='spent';
  var kinds=[['spent','I spent'],['owe','I owe someone'],['owed','Someone owes me']];
  return '<h2>'+(m.isNew?'New entry':'Edit entry')+'</h2>'
    +'<div class="fl">What is it<div class="chips">'+kinds.map(function(k){return chip('mk-kind','data-v="'+k[0]+'"',k[1],d.kind===k[0])}).join('')+'</div></div>'

function blocksToHtml(bl){

    if(b.type==='text')return String(b.text||'').split('\n').map(function(l){return '<div>'+(esc(l)||'<br>')+'</div>'}).join('');

function normalizeNote(n){

var OK_TAGS={DIV:1,P:1,BR:1,SPAN:1,B:1,STRONG:1,I:1,EM:1,U:1,UL:1,OL:1,LI:1,H2:1,H3:1,HR:1};
var OK_STYLE=['color','background-color','font-family','font-weight','font-style','text-decoration-line'];
function sanitizeHtml(html){
  var t=document.createElement('template');t.innerHTML=html||'';
  var out=document.createElement('div');
  (function walk(from,to){
    for(var i=0;i<from.childNodes.length;i++){
      var c=from.childNodes[i];
      if(c.nodeType===3){to.appendChild(document.createTextNode(c.nodeValue));continue}
      if(c.nodeType!==1)continue;
      if(c.tagName==='SCRIPT'||c.tagName==='STYLE')continue;
      if(!OK_TAGS[c.tagName]){walk(c,to);continue}
      var e=document.createElement(c.tagName.toLowerCase());
      if(c.tagName!=='BR'&&c.tagName!=='HR'){
        var cls=(c.getAttribute('class')||'').split(/\s+/).filter(function(x){return x==='ck'||x==='cb'||x==='ct'});
        if(cls.length)e.setAttribute('class',cls.join(' '));
        if(c.getAttribute('data-done')==='1')e.setAttribute('data-done','1');else if(c.getAttribute('data-done')==='0')e.setAttribute('data-done','0');
        var st=[];
        OK_STYLE.forEach(function(pn){var v=c.style&&c.style.getPropertyValue(pn);if(v&&!/url\(|expression|javascript/i.test(v))st.push(pn+':'+v)});
        if(st.length)e.setAttribute('style',st.join(';'));
      }
      walk(c,e);to.appendChild(e);
    }
  })(t.content,out);
  return out.innerHTML;
}
function htmlDoc(html){return new DOMParser().parseFromString('<body>'+(html||'')+'</body>','text/html')}
function zw(str){return String(str||'').replace(/​/g,'')}

function edEl(){return document.getElementById('ed')}
function edSave(){

function edRestore(){
  var ed=edEl();if(!ed)return;
  ed.focus();
  if(ui.edRange){var sel=window.getSelection();sel.removeAllRanges();sel.addRange(ui.edRange)}
}
function placeCaret(el,end){
  var r=document.createRange();r.selectNodeContents(el);r.collapse(!end);
  var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);edSave();
}
function makeCk(inner,done){
  var d=document.createElement('div');d.className='ck';d.setAttribute('data-done',done?'1':'0');
  var cb=document.createElement('span');cb.className='cb';cb.setAttribute('contenteditable','false');
  var ct=document.createElement('span');ct.className='ct';ct.innerHTML=inner||'<br>';
  d.appendChild(cb);d.appendChild(ct);return d;
}
function edFix(ed){
  [].slice.call(ed.querySelectorAll('.cb')).forEach(function(c){c.setAttribute('contenteditable','false')});
  for(var i=0;i<ed.childNodes.length;i++){
    var c=ed.childNodes[i];
    if(c.nodeType===3){var d=document.createElement('div');ed.replaceChild(d,c);d.appendChild(c)}
  }
  if(!ed.childNodes.length)ed.innerHTML='<div><br></div>';
}
var edT=null;
function edChanged(){
  var m=ui.modal,ed=edEl();if(!m||m.kind!=='note'||!ed)return;
  var n=getNote(m.id);if(!n)return;
  clearTimeout(edT);
  edT=setTimeout(function(){n.html=sanitizeHtml(ed.innerHTML);n.updated=Date.now();saveNotes()},150);
}
function edFlush(){
  var m=ui.modal,ed=edEl();if(!m||m.kind!=='note'||!ed)return;
  var n=getNote(m.id);if(!n)return;
  clearTimeout(edT);n.html=sanitizeHtml(ed.innerHTML);n.updated=Date.now();saveNotes();
}
function topBlock(node){
  var ed=edEl();
  while(node&&node.parentNode!==ed)node=node.parentNode;
  return node;
}
function toggleChecklist(){
  var ed=edEl(),sel=window.getSelection();if(!sel.rangeCount)return;
  var blk=topBlock(sel.anchorNode);
  if(!blk){var nd=makeCk('',false);ed.appendChild(nd);placeCaret(nd.querySelector('.ct'),true);return}
  if(blk.nodeType===3){var w=document.createElement('div');blk.parentNode.replaceChild(w,blk);w.appendChild(blk);blk=w}
  if(blk.classList&&blk.classList.contains('ck')){
    var d=document.createElement('div');d.innerHTML=blk.querySelector('.ct').innerHTML||'<br>';blk.parentNode.replaceChild(d,blk);placeCaret(d,true);return;
  }
  if(blk.tagName==='UL'||blk.tagName==='OL'){
    var frag=document.createDocumentFragment(),last=null;
    [].slice.call(blk.children).forEach(function(li){last=makeCk(li.innerHTML,false);frag.appendChild(last)});
    blk.parentNode.replaceChild(frag,blk);if(last)placeCaret(last.querySelector('.ct'),true);return;
  }
  var ck=makeCk(blk.innerHTML,false);
  blk.parentNode.replaceChild(ck,blk);placeCaret(ck.querySelector('.ct'),true);
}
function toggleHeading(){
  var sel=window.getSelection();if(!sel.rangeCount)return;
  var blk=topBlock(sel.anchorNode);
  document.execCommand('formatBlock',false,(blk&&blk.tagName==='H3')?'div':'h3');
}
function edCmd(cmd,val){
  edRestore();
  try{document.execCommand('styleWithCSS',false,true)}catch(e){}
  if(cmd==='checklist')toggleChecklist();
  else if(cmd==='bullets')document.execCommand('insertUnorderedList');
  else if(cmd==='numbers')document.execCommand('insertOrderedList');
  else if(cmd==='heading')toggleHeading();
  else if(cmd==='divider')document.execCommand('insertHorizontalRule');
  else if(cmd==='bold'||cmd==='italic'||cmd==='underline')document.execCommand(cmd);
  else if(cmd==='clear')document.execCommand('removeFormat');
  else if(cmd==='font')document.execCommand('fontName',false,val);
  else if(cmd==='color')document.execCommand('foreColor',false,val);
  else if(cmd==='hilite')document.execCommand('hiliteColor',false,val);
  var ed=edEl();if(ed){edFix(ed);edSave()}
  edChanged();
}

function initEditor(){
  var ed=edEl(),m=ui.modal;if(!ed||!m||m.kind!=='note')return;
  var n=getNote(m.id);if(!n)return;
  ed.innerHTML=sanitizeHtml(n.html)||'<div><br></div>';
  edFix(ed);
  try{document.execCommand('defaultParagraphSeparator',false,'div');document.execCommand('styleWithCSS',false,true)}catch(e){}
  ed.addEventListener('input',function(){edFix(ed);edChanged()});
  ed.addEventListener('keyup',edSave);ed.addEventListener('mouseup',edSave);ed.addEventListener('blur',edSave);
  ed.addEventListener('click',function(e){
    var cb=e.target.closest&&e.target.closest('.cb');
    if(cb){var ck=cb.closest('.ck');if(ck){ck.setAttribute('data-done',ck.getAttribute('data-done')==='1'?'0':'1');edChanged()}}
  });
  ed.addEventListener('paste',function(e){
    e.preventDefault();
    var t=(e.clipboardData||window.clipboardData).getData('text/plain');
    document.execCommand('insertText',false,t);
  });
  ed.addEventListener('keydown',function(e){
    var sel=window.getSelection();if(!sel.rangeCount)return;
    var node=sel.anchorNode,el=node&&(node.nodeType===1?node:node.parentNode);
    var ck=el&&el.closest?el.closest('.ck'):null;
    if(!ck||!ed.contains(ck))return;
    var ct=ck.querySelector('.ct');
    if(e.key==='Enter'&&!e.shiftKey){
      e.preventDefault();
      if(!zw(ct.textContent).trim()){
        var d=document.createElement('div');d.innerHTML='<br>';ck.parentNode.replaceChild(d,ck);placeCaret(d,false);
      }else{
        var rr=document.createRange();rr.setStart(sel.anchorNode,sel.anchorOffset);rr.setEnd(ct,ct.childNodes.length);
        var frag=rr.extractContents();
        var nk=makeCk('',false);var nct=nk.querySelector('.ct');
        if(zw(frag.textContent).length){nct.innerHTML='';nct.appendChild(frag)}
        if(!zw(ct.textContent).length&&!ct.querySelector('br'))ct.innerHTML='<br>';
        ck.parentNode.insertBefore(nk,ck.nextSibling);placeCaret(nct,false);
      }
      edChanged();
    }else if(e.key==='Backspace'&&sel.isCollapsed){
      var pre=document.createRange();pre.setStart(ct,0);pre.setEnd(sel.anchorNode,sel.anchorOffset);
      if(!zw(pre.toString()).length){
        e.preventDefault();
        var d2=document.createElement('div');d2.innerHTML=ct.innerHTML||'<br>';ck.parentNode.replaceChild(d2,ck);placeCaret(d2,false);edChanged();
      }
    }
  });
  if(m.fresh){ed.focus();placeCaret(ed.firstChild,false);m.fresh=false}
}

function secNeighbors(date,id){

  return {cur:arr[i],prev:arr[i-1]||null,next:arr[i+1]||null,nn:arr[i+2]||null};
}

/* ---------- task save / delete ---------- */
function ruleFromDraft(d,start){
  var rule,until=null;
  if(d.kind==='once')rule={kind:'once'};
  else if(d.kind==='daily')rule={kind:'rep',unit:'day',every:1};
  else if(d.kind==='weekly')rule={kind:'rep',unit:'week',every:1,days:d.days.length?d.days.slice():[wd(start)]};
  else{
    rule={kind:'rep',unit:d.unit,every:Math.max(1,parseInt(d.every,10)||1)};
    if(d.unit==='week')rule.days=d.days.length?d.days.slice():[wd(start)];
  }
  if(d.kind!=='once'){
    if(d.durKind==='count'){var n=Math.max(1,parseInt(d.durN,10)||1);until=addDays(start,n*(d.durUnit==='weeks'?7:1)-1)}
    else if(d.durKind==='date'&&d.untilDate)until=d.untilDate;
  }
  return {rule:rule,until:until};
}
function timeOf(d){
  if(!d.ts&&!d.te)return null;
  var sm=d.ts?toMin(d.ts):Math.max(0,toMin(d.te)-60);
  var em=d.te?toMin(d.te):Math.min(1439,sm+60);
  if(em<=sm)em=Math.min(sm+60,1439);
  return {s:toHM(sm),e:toHM(em)};
}
function saveModalTask(){
  var m=ui.modal,d=m.draft;
  d.subs=d.subs.filter(function(s){return s.title.trim()});
  if(!d.title.trim()){toast('Give the task a name first.');return}
  var subs=d.subs.map(function(s){return {id:s.id||uid(),title:s.title.trim()}});
  var title=d.title.trim();
  if(m.isNew){
    var r=ruleFromDraft(d,m.date);
    state.tasks.push({id:uid(),title:title,section:d.section,star:d.star,color:d.color||null,start:m.date,until:r.until,rule:r.rule,skip:[],subs:subs,time:timeOf(d)});
  }else{
    var t=state.tasks.filter(function(x){return x.id===m.taskId})[0];
    if(!t){closeModal();return}
    if(m.repeating&&m.scope==='day'){
      t.skip=(t.skip||[]).concat([m.date]);
      var nid=uid();
      var idMap={};subs.forEach(function(s){var nsid=uid();idMap[s.id]=nsid;s.id=nsid});
      state.tasks.push({id:nid,title:title,section:d.section,star:d.star,color:d.color||null,start:m.date,until:null,rule:{kind:'once'},skip:[],subs:subs,time:timeOf(d)});
      var ym=m.date.slice(0,7),dm=state.done[ym]||{};
      Object.keys(dm).forEach(function(k){
        var p=k.split('|');
        if(p[0]===m.date&&p[1]===t.id){
          var nk=m.date+'|'+nid+(p[2]?'|'+(idMap[p[2]]||p[2]):'');
          delete dm[k];dm[nk]=1;
        }
      });
      saveDone(ym);
    }else{
      var r2=ruleFromDraft(d,t.start);
      t.title=title;t.section=d.section;t.star=d.star;t.color=d.color||null;t.subs=subs;t.time=timeOf(d);t.rule=r2.rule;t.until=r2.until;
    }
  }
  saveTasks();closeModal();render();toast('Saved');
}
function deleteTask(taskId,date,how){
  var t=state.tasks.filter(function(x){return x.id===taskId})[0];if(!t)return;
  if(how==='day')t.skip=(t.skip||[]).concat([date]);
  else if(how==='future'){
    if(date<=t.start)state.tasks=state.tasks.filter(function(x){return x.id!==taskId});
    else t.until=addDays(date,-1);
  }else state.tasks=state.tasks.filter(function(x){return x.id!==taskId});
  saveTasks();closeModal();render();toast('Deleted');
}

    case 'note-new':{var nn={id:uid(),title:'',html:'<div><br></div>',updated:Date.now()};state.notes.push(nn);saveNotes();openModal({kind:'note',id:nn.id,fresh:true});break}
    case 'note-open':openModal({kind:'note',id:el.dataset.id});break;
    case 'note-del':{if(!m.confirm){m.confirm=true;renderModal();break}state.notes=state.notes.filter(function(x){return x.id!==m.id});saveNotes();ui.modal=null;$('#modal').innerHTML='';render();toast('Deleted');break}
    case 'ed-plus':{edSave();var pop=document.getElementById('pop');pop.hidden=!pop.hidden;el.setAttribute('aria-expanded',String(!pop.hidden));break}

    case 'nf':ui.nf.kind=el.dataset.v;render();break;
    case 'star':{var st=getTask(el.dataset.id);if(st){st.star=!st.star;saveTasks();render()}break}
    case 'backup':openModal({kind:'backup'});break;
    case 't-color':{if(!m||!m.draft)break;m.draft.color=el.dataset.v||'';[].slice.call(document.querySelectorAll('#tcol .sw')).forEach(function(b){b.setAttribute('aria-pressed',String((b.dataset.v||'')===(el.dataset.v||'')))});var ci=document.querySelector('#tcol input[type=color]');if(ci&&el.dataset.v)ci.value=el.dataset.v;break}
    case 'settings':openModal({kind:'settings'});break;
    case 'pref-bg':setPrefs({bg:el.dataset.v});renderModal();break;
    case 'pref-accent':setPrefs({accent:el.dataset.v==='auto'?null:el.dataset.v});renderModal();break;
    case 'pref-reset':setPrefs(DEFPREFS);renderModal();break;
    case 'move-do':doMove(m.id,m.date,m.sec,m.idx,el.dataset.v);break;
    case 'snap-restore':{
      var si=parseInt(el.dataset.i,10);
      var sn=state.snaps[si];
      try{maybeSnapshot(true);restoreBackup(sn.json);ui.modal=null;$('#modal').innerHTML='';render();toast('Restored from '+fmtShort(sn.d))}
      catch(err){m.snapConfirm=null;renderModal();toast('Could not restore that backup.')}
      break}
    case 'bk-copy':{
      var bt=$('#bk-out').value;
      var done=function(){state.meta.lastBackup=Date.now();saveMeta();Store.status();toast('Backup copied')};
      var fail=function(){var o=$('#bk-out');o.focus();o.select();toast('Press and hold the text, then tap Copy')};
      try{navigator.clipboard.writeText(bt).then(done,fail)}catch(err){fail()}
      break}
    case 'bk-restore':{
      var txt=(m.pasted||'').trim();
      if(!txt){toast('Paste a backup first.');break}
      try{JSON.parse(txt)}catch(err){toast('That text is not a valid backup.');break}
      try{maybeSnapshot(true);restoreBackup(txt);ui.modal=null;$('#modal').innerHTML='';render();toast('Restored. Your earlier data was kept as an automatic backup.')}catch(err){m.confirm=false;renderModal();toast('That text is not a valid backup.')}
      break}
    case 'm-sub-add':addModalSub();break;
    case 'm-time-fill':applyTimeDefault(m);renderModal();break;
    case 'm-time-clear':m.draft.ts='';m.draft.te='';renderModal();break;
    case 'm-sub-del':m.draft.subs.splice(parseInt(el.dataset.i,10),1);renderModal();break;
    case 'm-save':saveModalTask();break;
    case 'm-delete':{
      var tk=state.tasks.filter(function(x){return x.id===m.taskId})[0];
      if(tk&&tk.rule.kind!=='once')openModal({kind:'delete',taskId:m.taskId,date:m.date});
      else if(tk)deleteTask(m.taskId,m.date,'all');
      break}
    case 'del':deleteTask(m.taskId,m.date,el.dataset.v);break;
    case 'tm-scope':m.scope=el.dataset.v;[].slice.call(document.querySelectorAll('[data-act=tm-scope]')).forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===m.scope))});break;
    case 'tm-save':{
      var nb=secNeighbors(m.date,m.sec);
      var sv=readTimeBox('tm-s',(m.ap||{}).s||'AM');
      if(sv===null){toast('Type an hour from 1 to 12 and minutes from 0 to 59.');break}
      var ev=null;
      if(nb.next){
        ev=readTimeBox('tm-e',(m.ap||{}).e||'AM');
        if(ev===null){toast('Type an hour from 1 to 12 and minutes from 0 to 59.');break}
        if(ev<=sv){toast('The end has to be after the start.');break}
        if(nb.nn&&ev>=nb.nn.start){toast('That runs into '+SEC[nb.nn.id].name.toLowerCase()+', which starts at '+f12(nb.nn.start)+'.');break}
      }
      if(nb.prev&&sv<=nb.prev.start){toast('That starts before '+SEC[nb.prev.id].name.toLowerCase()+' does ('+f12(nb.prev.start)+').');break}
      var put=function(id,v){
        if(m.scope==='day'){(state.meta.dateTimes[m.date]=state.meta.dateTimes[m.date]||{})[id]=v}
        else{(state.meta.weekTimes[wd(m.date)]=state.meta.weekTimes[wd(m.date)]||{})[id]=v;if(state.meta.dateTimes[m.date])delete state.meta.dateTimes[m.date][id]}
      };
      put(m.sec,hmStr(sv));
      if(nb.next)put(nb.next.id,hmStr(ev));

    case 'tm-reset':{
      if(state.meta.dateTimes[m.date])delete state.meta.dateTimes[m.date][m.sec];
      if(state.meta.weekTimes[wd(m.date)])delete state.meta.weekTimes[wd(m.date)][m.sec];
      saveMeta();closeModal();render();toast('Back to default');break}
    case 'studymode':ui.studyMode=el.dataset.v;render();break;
    case 'study-pick':ui.studyDate=el.dataset.date;ui.date=el.dataset.date;render();var sc=$('#st-subj');if(sc)sc.focus({preventScroll:true});break;
    case 'study-add':addStudy();break;
    case 'study-del':state.study=state.study.filter(function(x){return x.id!==el.dataset.id});saveStudy();render();break;
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.pref){prefInput(el);return}
  if(el.dataset.chg){
    switch(el.dataset.chg){
      case 'toggle':setDone(ui.date,el.dataset.id,null,el.checked);break;
      case 'sec-all':{var its=tasksOn(ui.date).filter(function(t){return t.section===el.dataset.sec});setDoneMany(ui.date,its,el.checked);break}
      case 'toggle-sub':setDone(ui.date,el.dataset.id,el.dataset.sub,el.checked);break;
      case 'qrep':ui.quickRep=el.value;break;
      case 'mf-sel':ui.mf[el.dataset.key]=el.value;var ml=$('#mlist');if(ml)ml.innerHTML=moneyListHTML();break;
      case 'm-settle':{var se=state.money.filter(function(x){return x.id===el.dataset.id})[0];if(se){se.settled=el.checked;saveMoney();render()}break}
      case 'study-toggle':{var s=state.study.filter(function(x){return x.id===el.dataset.id})[0];if(s){s.done=el.checked;saveStudy();render()}break}
    }
    return;
  }
  bindField(el,true);
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.tcolor&&ui.modal&&ui.modal.draft){ui.modal.draft.color=el.value;[].slice.call(document.querySelectorAll('#tcol .sw')).forEach(function(b){b.setAttribute('aria-pressed','false')});return}
  if(el.dataset&&el.dataset.pref){prefInput(el);return}
  if(el.dataset&&el.dataset.note==='title'){var tn=getNote(ui.modal&&ui.modal.id);if(tn){tn.title=el.value;tn.updated=Date.now();saveNotes()}return}
  if(el.dataset&&el.dataset.bkin){if(ui.modal)ui.modal.pasted=el.value;return}
  if(el.dataset&&el.dataset.nq){ui.nf.q=el.value;var nl=$('#nlist');if(nl)nl.innerHTML=notesListHTML();return}
  if(el.dataset&&el.dataset.mq){ui.mf.q=el.value;var ml=$('#mlist');if(ml)ml.innerHTML=moneyListHTML();return}
  bindField(el,false);
});
function bindField(el,isChange){
  var m=ui.modal;if(!m||(m.kind!=='task'&&m.kind!=='money'))return;
  if(el.dataset.bindSub!==undefined){m.draft.subs[parseInt(el.dataset.bindSub,10)].title=el.value;return}
  var key=el.dataset.bind;if(!key)return;
  var val=el.type==='checkbox'?el.checked:el.value;
  m.draft[key]=val;
  if(isChange&&el.dataset.rerender)renderModal();
}
function applyTimeDefault(m){
  var r=sectionRanges(m.date)[m.draft.section];if(!r)return;
  m.draft.ts=toHM(r.start);m.draft.te=toHM(Math.min(r.end,r.start+90,1439));
}
function addModalSub(){
  var inp=$('#m-subnew');if(!inp||!inp.value.trim())return;
  ui.modal.draft.subs.push({id:uid(),title:inp.value.trim()});
  ui.modal.noFocus=true;renderModal();ui.modal.noFocus=false;
  var n=$('#m-subnew');if(n)n.focus();
}
function addStudy(){
  var subj=$('#st-subj').value.trim(),chap=$('#st-chap').value.trim(),mins=parseInt($('#st-mins').value,10)||0;
  if(!subj||!chap){toast('Add a subject and a chapter.');return}
  state.study.push({id:uid(),date:ui.studyDate,subject:subj,chapter:chap,mins:mins,done:false});
  saveStudy();render();var n=$('#st-chap');if(n)n.focus({preventScroll:true});
}
document.addEventListener('mousedown',function(e){if(e.target.closest&&e.target.closest('#pop,.plus'))e.preventDefault()});
document.addEventListener('selectionchange',edSave);
function quickAdd(el){
  var title=el.value.trim();if(!title)return;
  var date=ui.date,kind=ui.quickRep,rule={kind:'once'};
  if(kind==='daily')rule={kind:'rep',unit:'day',every:1};
  if(kind==='weekly')rule={kind:'rep',unit:'week',every:1,days:[wd(date)]};
  state.tasks.push({id:uid(),title:title,section:el.dataset.sec,star:false,start:date,until:null,rule:rule,skip:[],subs:[],time:null});
  saveTasks();ui.focus='add-'+el.dataset.sec;render();
}
document.addEventListener('submit',function(e){
  var f=e.target;
  if(f&&f.dataset&&f.dataset.addform){e.preventDefault();var inp=f.querySelector('.addin');if(inp)quickAdd(inp)}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&ui.modal){closeModal();return}
  if(e.key!=='Enter')return;
  var el=e.target;
  if(ui.modal&&ui.modal.kind==='money'&&el.dataset&&el.dataset.bind&&el.type!=='checkbox'){e.preventDefault();saveMoneyEntry();return}

    e.preventDefault();quickAdd(el);
