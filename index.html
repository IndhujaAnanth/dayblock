  }else if(el.id==='m-subnew'){e.preventDefault();addModalSub()}
  else if(el.id==='st-chap'||el.id==='st-subj'||el.id==='st-mins'){e.preventDefault();addStudy()}
});

/* ---------- drag a section block to a new time ---------- */
var bdrag=null;
document.addEventListener('pointerdown',function(e){
  if(e.button>0||(ui.modal))return;
  var hd=e.target.closest&&e.target.closest('.blk > header');
  if(!hd||e.target.closest('button'))return;
  var blk=hd.parentNode,id=blk.dataset.sec;if(!id)return;
  var nb=secNeighbors(ui.date,id);if(!nb.cur)return;
  var lo=nb.prev?nb.prev.start+5:0;
  var minD=lo-nb.cur.start,maxD;
  if(nb.next)maxD=(nb.nn?nb.nn.start-5:1440)-nb.cur.end;else maxD=nb.cur.end-5-nb.cur.start;
  bdrag={id:id,blk:blk,hd:hd,y0:e.clientY,s0:nb.cur.start,e0:nb.cur.end,hasNext:!!nb.next,minD:minD,maxD:maxD,d:0,pid:e.pointerId};
  try{hd.setPointerCapture(e.pointerId)}catch(err){}
  e.preventDefault();
});
document.addEventListener('pointermove',function(e){
  if(!bdrag||e.pointerId!==bdrag.pid)return;
  var d=Math.round((e.clientY-bdrag.y0)/HOUR_H*60/5)*5;
  d=Math.max(bdrag.minD,Math.min(bdrag.maxD,d));
  bdrag.d=d;
  var ns=bdrag.s0+d,ne=bdrag.hasNext?bdrag.e0+d:bdrag.e0;
  bdrag.blk.style.top=(ns/60*HOUR_H+1)+'px';
  bdrag.blk.style.height=Math.max((ne-ns)/60*HOUR_H-3,34)+'px';
  bdrag.blk.style.opacity='.85';bdrag.blk.style.zIndex='5';
  var tm=bdrag.blk.querySelector('[data-act=edit-time]');if(tm)tm.textContent=f12(ns)+' \u2013 '+f12(ne);
});
function endBdrag(e,cancel){
  if(!bdrag||(e&&e.pointerId!==bdrag.pid))return;
  var b=bdrag;bdrag=null;
  try{b.hd.releasePointerCapture(e.pointerId)}catch(err){}
  if(cancel||b.d===0){render();return}
  var ns=b.s0+b.d,ne=b.hasNext?b.e0+b.d:b.e0;
  openModal({kind:'time',sec:b.id,date:ui.date,scope:'day',sMin:ns,eMin:ne,fromDrag:true});
}
document.addEventListener('pointerup',function(e){endBdrag(e,false)});
document.addEventListener('pointercancel',function(e){endBdrag(e,true)});
/* ---------- drag to reorder ---------- */
var drag=null,dragRaf=0;
function applyOrder(ids){
  var pos=[],byId={};
  state.tasks.forEach(function(t,i){byId[t.id]=t;if(ids.indexOf(t.id)>=0)pos.push(i)});
  pos.forEach(function(p,k){state.tasks[pos[k]]=byId[ids[k]]});
  saveTasks();
}
function sameSectionIds(li){
  return [].slice.call(li.parentNode.children).filter(function(x){return x.classList&&x.classList.contains('task')}).map(function(x){return x.dataset.id});
}
function measureCards(){
  return [].slice.call(document.querySelectorAll('#main .scard')).map(function(c){
    var r=c.getBoundingClientRect(),items=[].slice.call(c.querySelectorAll('ul.tasks > li.task'));
    var empty=c.querySelector('.empty'),anchor=(empty||c.querySelector('.shead')).getBoundingClientRect();
    return {el:c,sec:c.dataset.section,top:r.top+window.scrollY,bottom:r.bottom+window.scrollY,left:r.left+window.scrollX,width:r.width,
      items:items,rects:items.map(function(i){var q=i.getBoundingClientRect();return {top:q.top+window.scrollY,h:q.height}}),
      emptyTop:(empty?anchor.top:anchor.bottom)+window.scrollY};
  });
}
function clearShifts(){drag.srcCard.items.forEach(function(x){x.style.transform=''; if(x!==drag.li)x.style.transform=''})}
function setDropline(x,y,w){
  var d=document.getElementById('dropline');
  if(!d){d=document.createElement('div');d.id='dropline';d.className='dropline';document.body.appendChild(d)}
  d.style.left=x+'px';d.style.top=y+'px';d.style.width=w+'px';d.style.display='block';
}
function hideDropline(){var d=document.getElementById('dropline');if(d)d.style.display='none'}
function updateDrag(){
  if(!drag)return;
  var dx=drag.x-drag.startX,dy=(drag.y-drag.startY)+(window.scrollY-drag.startScroll);
  drag.li.style.transform='translate('+dx+'px,'+dy+'px)';
  var py=drag.y+window.scrollY,tc=null,best=1e9;
  drag.cards.forEach(function(c){
    var dist=py<c.top?c.top-py:(py>c.bottom?py-c.bottom:0);
    if(dist<best){best=dist;tc=c}
  });
  drag.cards.forEach(function(c){c.el.classList.toggle('droptarget',c!==drag.srcCard&&c===tc)});
  var src=drag.srcCard,hh=src.rects[drag.from].h;
  if(tc===src){
    hideDropline();drag.target=null;
    var center=src.rects[drag.from].top+hh/2+dy,to=0;
    src.items.forEach(function(x,i){if(i!==drag.from&&src.rects[i].top+src.rects[i].h/2<center)to++});
    drag.to=to;
    src.items.forEach(function(x,i){
      if(i===drag.from)return;
      var k=i<drag.from?i:i-1,shift=0;
      if(i<drag.from&&k>=to)shift=hh;else if(i>drag.from&&k<to)shift=-hh;
      x.style.transform=shift?'translateY('+shift+'px)':'';
    });
  }else{
    src.items.forEach(function(x,i){if(i!==drag.from)x.style.transform=''});
    drag.to=drag.from;
    var idx=0;
    tc.items.forEach(function(x,i){if(tc.rects[i].top+tc.rects[i].h/2<py)idx++});
    var y=tc.items.length?(idx<tc.items.length?tc.rects[idx].top:tc.rects[tc.items.length-1].top+tc.rects[tc.items.length-1].h):tc.emptyTop;
    setDropline(tc.left+12,y-2,tc.width-24);
    drag.target={sec:tc.sec,idx:idx};
  }
}
function dragLoop(){
  if(!drag)return;
  var h=window.innerHeight;
  if(drag.y<80)window.scrollBy(0,-14);else if(drag.y>h-80)window.scrollBy(0,14);
  updateDrag();
  dragRaf=requestAnimationFrame(dragLoop);
}
function endDrag(commit){
  if(!drag)return;
  cancelAnimationFrame(dragRaf);
  var d=drag;drag=null;
  document.body.classList.remove('dragging-task');
  hideDropline();
  d.cards.forEach(function(c){c.el.classList.remove('droptarget');c.items.forEach(function(x){x.style.transform='';x.classList.remove('dragging')})});
  if(commit&&d.target){
    var t=getTask(d.id);
    render();
    if(t&&t.rule.kind==='once')doMove(d.id,ui.date,d.target.sec,d.target.idx,'all');
    else if(t)openModal({kind:'movescope',id:d.id,sec:d.target.sec,idx:d.target.idx,date:ui.date});
    return;
  }
  if(commit&&d.to!==d.from){
    var ids=d.srcCard.items.map(function(x){return x.dataset.id}).filter(function(id){return id!==d.id});
    ids.splice(d.to,0,d.id);
    applyOrder(ids);
  }
  render();
}
document.addEventListener('pointerdown',function(e){
  var g=e.target.closest&&e.target.closest('.grip');if(!g||(e.button&&e.button!==0))return;
  var li=g.closest('li.task');if(!li)return;
  var cards=measureCards(),card=cards.filter(function(c){return c.items.indexOf(li)>=0})[0];
  if(!card)return;
  var from=card.items.indexOf(li);
  drag={id:li.dataset.id,li:li,cards:cards,srcCard:card,from:from,to:from,target:null,startX:e.clientX,startY:e.clientY,startScroll:window.scrollY,x:e.clientX,y:e.clientY};
  li.classList.add('dragging');document.body.classList.add('dragging-task');
  try{g.setPointerCapture(e.pointerId)}catch(err){}
  e.preventDefault();
  dragRaf=requestAnimationFrame(dragLoop);
});
document.addEventListener('pointermove',function(e){if(drag){drag.x=e.clientX;drag.y=e.clientY;e.preventDefault()}});
document.addEventListener('pointerup',function(){endDrag(true)});
document.addEventListener('pointercancel',function(){endDrag(false)});
document.addEventListener('keydown',function(e){
  var g=e.target.closest&&e.target.closest('.grip');
  if(!g||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;
  e.preventDefault();
  var li=g.closest('li.task'),ids=sameSectionIds(li),i=ids.indexOf(li.dataset.id),j=i+(e.key==='ArrowUp'?-1:1);
  if(j<0||j>=ids.length)return;
  ids.splice(i,1);ids.splice(j,0,li.dataset.id);
  applyOrder(ids);ui.focus='grip-'+li.dataset.id;render();
});

/* ---------- boot ---------- */
function silently(fn){ui.silent=true;try{fn()}finally{ui.silent=false}}
function setStateFrom(meta,tasks,study,mon,nts){
  state.notes=((nts&&nts.list)?nts.list:[]).map(normalizeNote);
  state.money=(mon&&mon.list)?mon.list:[];
  state.meta=Object.assign(defaultMeta(),meta||{});
  state.meta.weekTimes=state.meta.weekTimes||{};state.meta.dateTimes=state.meta.dateTimes||{};
  state.meta.vis=state.meta.vis||{};state.meta.vis.all=state.meta.vis.all||{};state.meta.vis.week=state.meta.vis.week||{};state.meta.vis.date=state.meta.vis.date||{};
  state.tasks=(tasks&&tasks.list)?tasks.list:[];
  state.study=(study&&study.list)?study.list:[];
}
function migrate(){
  silently(function(){
    if(!state.meta.timetable1){applyTimetable();state.meta.timetable1=true;state.meta.noteTT=true;saveTasks();saveMeta()}
  });
}
function pushAll(){
  silently(function(){
    saveTasks();saveStudy();saveMeta();saveMoney();saveNotes();
    var ym=todayStr().slice(0,7);if(state.done[ym])saveDone(ym);
  });
}
function boot(){
  renderTabs();
  var ym=todayStr().slice(0,7);
  var lm=Store.readLocal('meta'),lt=Store.readLocal('tasks'),ls=Store.readLocal('study'),lmo=Store.readLocal('money'),lno=Store.readLocal('notes');
  var had=!!(lm&&lt&&lt.list);
  if(had){
    setStateFrom(lm,lt,ls,lmo,lno);
    var ld=Store.readLocal('done-'+ym);state.done[ym]=(ld&&ld.keys)||{};
    migrate();ui.ready=true;render();
  }
  Store.init().then(function(){
    return Promise.all([Store.read('meta'),Store.read('tasks'),Store.read('study'),Store.read('done-'+ym),Store.read('money'),Store.read('notes')]);
  }).then(function(r){
    var cloud=Store.mode==='cloud',cTasks=!!(r[1]&&r[1].list);
    if(cloud&&cTasks&&!ui.touched){
      Store.clearPending();
      setStateFrom(r[0],r[1],r[2],r[4],r[5]);
      state.done[ym]=(r[3]&&r[3].keys)||{};
      monthLoads={};
      migrate();
    }else if(cloud&&cTasks&&ui.touched){
      pushAll();
    }else if(had){
      if(cloud)pushAll();
    }else{
      silently(function(){
        setStateFrom(r[0],r[1],r[2],r[4],r[5]);
        if(!state.tasks.length&&!state.meta.seeded){state.tasks=seedTasks();state.meta.seeded=true;saveTasks();saveMeta()}
      });
      state.done[ym]=(r[3]&&r[3].keys)||{};
      migrate();
    }
    ui.ready=true;Store.status();render();
    loadSnaps();
  });
}
boot();
})();
